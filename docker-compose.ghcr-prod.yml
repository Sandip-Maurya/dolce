# GHCR Image Override for Production Deployment
# This file uses :prod tagged images from GitHub Container Registry
# Use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.cloudfront.yml -f docker-compose.ghcr-prod.yml up -d

services:
  backend:
    # Override build with GHCR production image
    image: ghcr.io/sandip-maurya/dolce-backend:prod
    build: null  # Disable local build

  frontend-next:
    # Override build with GHCR production image
    image: ghcr.io/sandip-maurya/dolce-frontend-next:prod
    build: null  # Disable local build

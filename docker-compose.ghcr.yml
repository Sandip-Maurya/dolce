# GHCR Image Override for EC2 Deployment
# This file replaces local builds with pre-built images from GitHub Container Registry
# Use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.prod-https.yml -f docker-compose.ghcr.yml up -d

services:
  backend:
    # Override build with GHCR image
    image: ghcr.io/sandip-maurya/dolce-backend:dev
    build: null  # Disable local build

  frontend-next:
    # Override build with GHCR image
    image: ghcr.io/sandip-maurya/dolce-frontend-next:dev
    build: null  # Disable local build

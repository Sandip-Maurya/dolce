# CloudFront Deployment Override (No Nginx)
# CloudFront routes directly to Django (:8000) and Next.js (:3000)
#
# Use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.cloudfront.yml -f docker-compose.ghcr.yml up -d
#
# CloudFront Origins:
#   - Origin 1: Lightsail-IP:3000 (Next.js) - for /*, SSR pages
#   - Origin 2: Lightsail-IP:8000 (Django) - for /admin/*, /api/*
#
# This configuration is optimized for 2GB RAM Lightsail instance without Nginx.

services:
  db:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
    # Reduce shared_buffers for smaller memory footprint
    command: >
      postgres 
      -c shared_buffers=128MB 
      -c max_connections=50
      -c effective_cache_size=256MB

  backend:
    # Expose Django directly to CloudFront
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: '0.6'
        reservations:
          memory: 320M
    environment:
      - DJANGO_ENV=production
      - DEBUG=False
      # CloudFront handles SSL, so we don't redirect here
      - SECURE_SSL_REDIRECT=False
      # Trust CloudFront's forwarded headers
      - USE_X_FORWARDED_HOST=True
      - SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https
    # Optimized gunicorn for direct CloudFront access
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        python check_db.py &&
        python manage.py migrate --noinput &&
        echo 'Collecting static files...' &&
        mkdir -p /app/staticfiles &&
        python manage.py collectstatic --noinput &&
        echo 'Static files collected successfully' &&
        gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 180 --graceful-timeout 30 --max-requests 1000 --max-requests-jitter 50 --access-logfile - --error-logfile - config.wsgi:application
      "

  frontend-next:
    # Expose Next.js directly to CloudFront
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.75'
        reservations:
          memory: 384M
    environment:
      # Trust proxy headers from CloudFront
      - TRUST_PROXY=true
      # Backend URL for server-side API calls (internal Docker network)
      - BACKEND_URL=http://backend:8000

  # Nginx is NOT used in CloudFront mode
  # CloudFront handles SSL termination and routing
  nginx:
    profiles:
      - disabled  # This prevents nginx from starting

# Memory allocation (2GB total):
#   - PostgreSQL: 512MB
#   - Django:     640MB
#   - Next.js:    768MB
#   - OS/Docker:  ~80MB headroom
#   - Total:      ~2000MB

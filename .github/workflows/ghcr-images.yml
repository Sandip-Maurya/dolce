name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - 'frontend-next/**'
      - '.github/workflows/ghcr-images.yml'
      - 'docker-compose.yml'
      - 'docker-compose.ghcr.yml'
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: sandip-maurya/dolce-backend
  FRONTEND_IMAGE_NAME: sandip-maurya/dolce-frontend-next

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Extract metadata for frontend
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-next
          file: ./frontend-next/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            BACKEND_URL=http://backend:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest summary
        run: |
          echo "### Backend Image 🐳" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: ${{ steps.backend-meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend Image 🐳" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: ${{ steps.frontend-meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
